<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIDCP Mascot Animation Demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ec;
      --panel: #fffdf8;
      --ink: #1c2b32;
      --muted: #66777d;
      --line: rgba(33, 48, 54, 0.14);
      --teal: #25a7b0;
      --warm: #f1b52e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top, #fff9eb 0, var(--bg) 42%, #eef6f6 100%);
    }

    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 40px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      max-width: 720px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .badge {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 248, 0.9);
      padding: 14px;
      overflow: hidden;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: 0;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid rgba(33, 48, 54, 0.08);
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(45deg, rgba(37, 167, 176, 0.06) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(37, 167, 176, 0.06) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(37, 167, 176, 0.06) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(37, 167, 176, 0.06) 75%),
        #fffdfa;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-size: 20px 20px;
    }

    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .wave-wing {
      transform-origin: 30% 49%;
      animation: wave-wing 1.05s ease-in-out infinite;
    }

    .blink-lid {
      position: absolute;
      width: 12%;
      height: 8%;
      border-radius: 999px;
      background: #f8f1de;
      border-top: 2px solid rgba(214, 158, 40, 0.82);
      transform: scaleY(0);
      animation: blink 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    .blink-lid.left {
      left: 32.8%;
      top: 40.2%;
      rotate: -8deg;
    }

    .blink-lid.right {
      left: 48.5%;
      top: 43.4%;
      rotate: -10deg;
    }

    .turn-head {
      transform-origin: 43% 51%;
      animation: head-turn 2.3s ease-in-out infinite;
    }

    .click-layer {
      transform-origin: 77% 29%;
      animation: click-press 1.45s ease-in-out infinite;
    }

    .ripple {
      position: absolute;
      left: 75.2%;
      top: 26.5%;
      width: 17%;
      aspect-ratio: 1;
      border: 4px solid rgba(37, 167, 176, 0.42);
      border-radius: 999px;
      transform: translate(-50%, -50%) scale(0.72);
      opacity: 0;
      animation: click-ripple 1.45s ease-out infinite;
      pointer-events: none;
    }

    .caption {
      margin-top: 10px;
      min-height: 42px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    @keyframes wave-wing {
      0%, 100% { transform: rotate(-8deg); }
      35% { transform: rotate(12deg); }
      68% { transform: rotate(-14deg); }
    }

    @keyframes blink {
      0%, 7%, 100% { transform: scaleY(0); }
      3.2%, 4.6% { transform: scaleY(1); }
    }

    @keyframes head-turn {
      0%, 100% { transform: rotate(-4deg) translateX(-2px); }
      48% { transform: rotate(5deg) translateX(3px); }
    }

    @keyframes click-press {
      0%, 28%, 100% { transform: translate(0, 0) scale(1); }
      36%, 47% { transform: translate(10px, 7px) scale(0.985); }
    }

    @keyframes click-ripple {
      0%, 30% { opacity: 0; transform: translate(-50%, -50%) scale(0.58); }
      38% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.78); }
      72%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); }
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      main {
        width: min(100vw - 20px, 420px);
        padding-top: 20px;
      }

      header {
        display: block;
      }

      .badge {
        display: inline-block;
        margin-top: 12px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .wave-wing,
      .blink-lid,
      .turn-head,
      .click-layer,
      .ripple {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>吉祥物短期动画 Demo</h1>
        <p>基于现有透明 PNG 做局部叠层动画，目标是快速验证 UI 中的动效方向；后续若要产品级质量，应重新出真正分层原画或 Rive 文件。</p>
      </div>
      <div class="badge">CSS + 局部 PNG 图层</div>
    </header>

    <section class="grid" aria-label="Mascot animation states">
      <article class="card">
        <h2>挥手</h2>
        <div class="stage">
          <img class="layer" src="animation/wave-base.png" alt="">
          <img class="layer wave-wing" src="animation/wave-wing.png" alt="">
        </div>
        <p class="caption">用于欢迎、引导、主动打招呼。短期版用左翼叠层旋转实现。</p>
      </article>

      <article class="card">
        <h2>眨眼</h2>
        <div class="stage">
          <img class="layer" src="animation/thinking-full.png" alt="">
          <span class="blink-lid left" aria-hidden="true"></span>
          <span class="blink-lid right" aria-hidden="true"></span>
        </div>
        <p class="caption">用于等待、思考、轻量 idle。短期版用眼皮遮罩模拟。</p>
      </article>

      <article class="card">
        <h2>转头</h2>
        <div class="stage">
          <img class="layer" src="animation/turn-base.png" alt="">
          <img class="layer turn-head" src="animation/turn-head.png" alt="">
        </div>
        <p class="caption">用于巡视、关注状态变化。短期版用头部区域叠层轻微摆动。</p>
      </article>

      <article class="card">
        <h2>点击按钮</h2>
        <div class="stage">
          <img class="layer" src="animation/click-base.png" alt="">
          <img class="layer click-layer" src="animation/click-layer.png" alt="">
          <span class="ripple" aria-hidden="true"></span>
        </div>
        <p class="caption">用于执行中、命令下发、按钮反馈。短期版用前臂/按钮叠层位移和光圈反馈。</p>
      </article>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIDCP Mascot Rig V4 Anchor Calibration</title>
  <style>
    :root {
      color-scheme: light;
      --page: #eef3f2;
      --surface: #ffffff;
      --ink: #1d2c30;
      --muted: #627176;
      --line: rgba(29, 44, 48, 0.16);
      --teal: #168d96;
      --red: #e23d35;
      --rig-scale: 0.84;
      --rig-y: 24px;
      --head-x: -12px;
      --head-y: -96px;
      --head-angle: 0deg;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--page);
    }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 560px) minmax(260px, 320px);
      gap: 24px;
      width: min(920px, 100%);
      margin: 0 auto;
      align-items: start;
    }

    h1 {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background-color: var(--surface);
      background-image:
        linear-gradient(45deg, rgba(22, 141, 150, 0.05) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(22, 141, 150, 0.05) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(22, 141, 150, 0.05) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(22, 141, 150, 0.05) 75%);
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      background-size: 24px 24px;
    }

    .rig-frame,
    .rig,
    .head-position,
    .head-rotation {
      position: absolute;
      inset: 0;
    }

    .rig-frame {
      transform: translateY(var(--rig-y)) scale(var(--rig-scale));
      transform-origin: 50% 50%;
    }

    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .wing {
      z-index: 1;
      transform: rotate(-8deg);
      transform-origin: 25.98% 54.1%;
    }

    .torso {
      z-index: 2;
    }

    .head-position {
      z-index: 3;
      transform: translate(var(--head-x), var(--head-y));
    }

    .head-rotation {
      transform: rotate(var(--head-angle));
      transform-origin: 45.3125% 71.4844%;
    }

    .marker {
      position: absolute;
      z-index: 5;
      border-radius: 50%;
      translate: -50% -50%;
      pointer-events: none;
    }

    .marker.torso-anchor {
      left: 42.96875%;
      top: 52.734375%;
      width: 22px;
      height: 22px;
      border: 2px solid var(--red);
    }

    .marker.head-anchor {
      left: 45.3125%;
      top: 71.484375%;
      width: 12px;
      height: 12px;
      border: 2px solid var(--teal);
    }

    .marker::before,
    .marker::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      background: currentColor;
      translate: -50% -50%;
    }

    .marker::before {
      width: 30px;
      height: 1px;
    }

    .marker::after {
      width: 1px;
      height: 30px;
    }

    .torso-anchor {
      color: var(--red);
    }

    .head-anchor {
      color: var(--teal);
    }

    .controls {
      display: grid;
      gap: 18px;
      padding-top: 4px;
    }

    .control {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr) 54px;
      align-items: center;
      gap: 10px;
    }

    label,
    output,
    .status {
      font-size: 13px;
    }

    output {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--teal);
    }

    .status {
      padding-block: 12px;
      border-block: 1px solid var(--line);
      color: var(--muted);
      line-height: 1.6;
    }

    .status strong {
      color: var(--ink);
      font-weight: 600;
    }

    .legend {
      display: flex;
      gap: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .swatch {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    .legend .torso-key {
      color: var(--red);
    }

    .legend .head-key {
      color: var(--teal);
    }

    button {
      justify-self: start;
      min-width: 88px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: var(--surface);
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      border-color: rgba(22, 141, 150, 0.5);
      background: #f5fbfa;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(22, 141, 150, 0.24);
      outline-offset: 2px;
    }

    @media (max-width: 760px) {
      body {
        padding: 12px;
      }

      main {
        grid-template-columns: 1fr;
      }

      h1 {
        grid-column: 1;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>吉祥物头颈锚点校准</h1>

    <section class="stage" aria-label="头部与身体接缝校准预览">
      <div class="rig-frame">
        <div class="rig">
          <img class="layer wing" src="animation-rig-v4/mascot-wing-left.png" alt="">
          <img class="layer torso" src="animation-rig-v4/mascot-torso.png" alt="">
          <span class="marker torso-anchor" aria-hidden="true"></span>
          <div class="head-position">
            <div class="head-rotation">
              <img class="layer" src="animation-rig-v4/mascot-head.png" alt="青绿色鸟类吉祥物">
              <span class="marker head-anchor" aria-hidden="true"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="controls" aria-label="锚点参数">
      <div class="legend">
        <span class="torso-key"><span class="swatch"></span>身体 neckSeat</span>
        <span class="head-key"><span class="swatch"></span>头部 neckBase</span>
      </div>

      <div class="control">
        <label for="head-x">头部 X</label>
        <input id="head-x" type="range" min="-40" max="20" value="-12" step="1">
        <output for="head-x">-12</output>
      </div>

      <div class="control">
        <label for="head-y">头部 Y</label>
        <input id="head-y" type="range" min="-130" max="-60" value="-96" step="1">
        <output for="head-y">-96</output>
      </div>

      <div class="control">
        <label for="angle">头部角度</label>
        <input id="angle" type="range" min="-6" max="6" value="0" step="0.5">
        <output for="angle">0deg</output>
      </div>

      <div class="control">
        <label for="rig-scale">整体缩放</label>
        <input id="rig-scale" type="range" min="0.72" max="0.92" value="0.84" step="0.01">
        <output for="rig-scale">0.84</output>
      </div>

      <div class="control">
        <label for="rig-y">画布 Y</label>
        <input id="rig-y" type="range" min="0" max="40" value="24" step="1">
        <output for="rig-y">24</output>
      </div>

      <div class="status">
        锚点差值：<strong id="delta">X 0 / Y 0</strong><br>
        运行时位移：<strong id="transform">translate(-12px, -96px)</strong>
      </div>

      <button type="button" id="reset">重置参数</button>
    </section>
  </main>

  <script>
    const root = document.documentElement;
    const defaults = {
      "head-x": -12,
      "head-y": -96,
      angle: 0,
      "rig-scale": 0.84,
      "rig-y": 24,
    };
    const controls = [...document.querySelectorAll('input[type="range"]')];
    const delta = document.getElementById("delta");
    const transform = document.getElementById("transform");

    function update() {
      const values = Object.fromEntries(controls.map((input) => [input.id, Number(input.value)]));
      root.style.setProperty("--head-x", `${values["head-x"]}px`);
      root.style.setProperty("--head-y", `${values["head-y"]}px`);
      root.style.setProperty("--head-angle", `${values.angle}deg`);
      root.style.setProperty("--rig-scale", values["rig-scale"]);
      root.style.setProperty("--rig-y", `${values["rig-y"]}px`);

      controls.forEach((input) => {
        const suffix = input.id === "angle" ? "deg" : "";
        input.nextElementSibling.textContent = `${input.value}${suffix}`;
      });

      const deltaX = 232 + values["head-x"] - 220;
      const deltaY = 366 + values["head-y"] - 270;
      delta.textContent = `X ${deltaX} / Y ${deltaY}`;
      transform.textContent = `translate(${values["head-x"]}px, ${values["head-y"]}px)`;
    }

    controls.forEach((input) => input.addEventListener("input", update));
    document.getElementById("reset").addEventListener("click", () => {
      controls.forEach((input) => {
        input.value = defaults[input.id];
      });
      update();
    });

    update();
  </script>
</body>
</html>
